<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mozgás – saját edzésnapló</title>
<meta name="theme-color" content="#18212B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mozgás">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F0EB; --surface:#FFFFFF; --surface-2:#F7F6F2; --ink:#18212B; --muted:#5E6873; --line:#DEDBD3;
  --accent:#E4572E; --accent-ink:#FFFFFF; --go:#2A7F62; --walk:#3E6FB0; --grid:#E9E6DF; --tab:#18212B; --tab-ink:#FFFFFF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151B; --surface:#18202A; --surface-2:#1F2833; --ink:#E9EDF1; --muted:#9AA6B2; --line:#2B3642;
    --accent:#F06A42; --go:#4FB58F; --walk:#6F9BDB; --grid:#222C37; --tab:#E9EDF1; --tab-ink:#10151B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151B; --surface:#18202A; --surface-2:#1F2833; --ink:#E9EDF1; --muted:#9AA6B2; --line:#2B3642;
  --accent:#F06A42; --go:#4FB58F; --walk:#6F9BDB; --grid:#222C37; --tab:#E9EDF1; --tab-ink:#10151B; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:24px 18px 120px}
h1,h2,.num{font-family:"Barlow Condensed","Barlow",system-ui,sans-serif}
h1{font-size:40px;line-height:1;font-weight:800;margin:0 0 4px;letter-spacing:.01em;text-transform:uppercase}
h2{font-size:22px;font-weight:700;margin:22px 0 10px;text-transform:uppercase;letter-spacing:.02em}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
button{font:inherit;color:inherit}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:11px;padding:10px 6px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--tab);color:var(--tab-ink)}
.seg button:focus-visible,.btn:focus-visible,.row:focus-visible,.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row2{display:flex;gap:10px;align-items:center;margin-bottom:14px}
select{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:1}
.big{text-align:center;padding:18px 10px 6px}
.big .val{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:76px;line-height:1;font-variant-numeric:tabular-nums}
.big .lbl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.phase{border-radius:18px;padding:16px;margin-bottom:12px;color:#fff;text-align:center}
.phase.run{background:var(--accent)}.phase.walk{background:var(--walk)}.phase.done{background:var(--go)}
.phase .pname{font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.phase .pcount{font-family:"Barlow Condensed",sans-serif;font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.phase .pnext{font-size:14px;opacity:.9}
.pbar{height:6px;border-radius:6px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;background:#fff;width:0}
.controls{display:flex;gap:10px;margin:6px 0 14px}
.btn{appearance:none;border:0;border-radius:16px;padding:16px;font-weight:700;font-size:18px;cursor:pointer;flex:1;text-transform:uppercase;letter-spacing:.04em}
.btn.go{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--tab);color:var(--tab-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:10px 14px;font-size:14px;flex:0 0 auto}
.note{font-size:14px;color:var(--muted)}
.warn{background:var(--surface-2);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 14px}
.gps{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.gps i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.gps.ok i{background:var(--go)}.gps.weak i{background:var(--accent)}
.map{isolation:isolate;position:relative;z-index:0;height:260px;border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:var(--surface-2)}
.map.tall{height:320px}
.mapwrap{position:relative}
.recenter{position:absolute;top:10px;right:10px;z-index:500;appearance:none;border:0;border-radius:12px;padding:9px 12px;font-weight:700;font-size:13px;background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}
.leaflet-container{font:inherit}
.backup{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.route{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}
.route svg{display:block;width:100%;height:auto}
.list{list-style:none;margin:0;padding:0}
.row{appearance:none;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;cursor:pointer}
.row .ico{grid-row:1/span 2;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);font-size:20px}
.row .t{font-weight:700}
.row .m{font-size:13px;color:var(--muted)}
.row .d{grid-row:1/span 2;font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;text-align:right}
.row .d small{display:block;font-family:"Barlow",sans-serif;font-size:12px;color:var(--muted);font-weight:500}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:15px}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tablewrap{overflow-x:auto}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.wk{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer}
.wk b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:20px}
.wk span{font-size:11px;color:var(--muted)}
.wk[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.wk.done{background:var(--surface-2)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;border:1px dashed var(--line);border-radius:18px}
.back{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;margin-bottom:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:3000}
.tabs-inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:14px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{background:var(--tab);color:var(--tab-ink)}
.tab .rec{position:absolute;top:6px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--accent);display:none}
.tab.live .rec{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:5000;padding:20px}
.modal .box{background:var(--surface);border-radius:20px;padding:20px;max-width:420px;width:100%}
.modal h3{font-family:"Barlow Condensed",sans-serif;font-size:26px;margin:0 0 6px;text-transform:uppercase}
</style>
</head>
<body>
<main id="app"></main>
<div id="modal"></div>
<nav class="tabs" aria-label="Menü">
  <div class="tabs-inner" role="tablist">
    <button class="tab" role="tab" data-tab="rogzites"><span class="rec"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>Rögzítés</button>
    <button class="tab" role="tab" data-tab="naplo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Napló</button>
    <button class="tab" role="tab" data-tab="statisztika"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Statisztika</button>
  </div>
</nav>
<script>
/* ---------- tárolás ---------- */
const KEY = "mozgas-app-v1";
let store = { acts: [], prog: {}, lastType: "futas", lastMode: "szabad", lastWeek: 1 };
try{ const raw = localStorage.getItem(KEY); if(raw) store = Object.assign(store, JSON.parse(raw)); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} };

const TYPES = { futas:{n:"Futás", ico:"🏃", max:8}, seta:{n:"Séta", ico:"🚶", max:4}, bicikli:{n:"Bicikli", ico:"🚴", max:25} };

/* ---------- futás-séta program (8 hét, hetente 2 alkalom) ---------- */
const WEEKS = [
  {run:60, walk:120, reps:8}, {run:90, walk:120, reps:6}, {run:120, walk:120, reps:5}, {run:180, walk:90, reps:4},
  {run:300, walk:120, reps:3}, {run:360, walk:90, reps:3}, {run:600, walk:120, reps:2}, {run:1200, walk:0, reps:1}
];
function programSteps(w){
  const W = WEEKS[w-1], st = [{k:"walk", n:"Bemelegítő séta", s:300}];
  for(let i=0;i<W.reps;i++){ st.push({k:"run", n:"Futás", s:W.run}); if(W.walk && i<W.reps-1) st.push({k:"walk", n:"Séta", s:W.walk}); }
  st.push({k:"walk", n:"Levezető séta", s:180});
  return st;
}
const fmtMin = s => s>=60 ? (s%60 ? (s/60).toFixed(1).replace(".",",")+" perc" : (s/60)+" perc") : s+" mp";
function weekLabel(w){ const W = WEEKS[w-1]; return W.walk ? `${W.reps}× (${fmtMin(W.run)} futás + ${fmtMin(W.walk)} séta)` : `${fmtMin(W.run)} folyamatos futás`; }
const stepsTotal = st => st.reduce((a,x)=>a+x.s,0);

/* ---------- segédek ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
function hms(s){ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; }
const km = m => (m/1000).toFixed(2).replace(".",",");
function pace(sec, meters){ if(meters < 20 || !sec) return "–:––"; const p = sec/(meters/1000); if(p>1800) return "–:––"; return `${Math.floor(p/60)}:${pad(Math.round(p%60)%60)}`; }
function speed(sec, meters){ if(!sec) return "0,0"; return (meters/sec*3.6).toFixed(1).replace(".",","); }
function hav(a,b){ const R=6371000, toR=Math.PI/180; const dLa=(b.lat-a.lat)*toR, dLo=(b.lon-a.lon)*toR; const s=Math.sin(dLa/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
const dateStr = ts => { const d=new Date(ts); return d.toLocaleDateString("hu-HU",{month:"short",day:"numeric",weekday:"short"})+" "+pad(d.getHours())+":"+pad(d.getMinutes()); };

/* ---------- hang, rezgés, ébren tartás ---------- */
let audioCtx=null, wakeLock=null;
function ensureAudio(){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }
function beep(times=2, freq=880){
  try{ ensureAudio(); const now=audioCtx.currentTime;
    for(let i=0;i<times;i++){ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=freq; g.gain.setValueAtTime(0.0001,now+i*.3); g.gain.exponentialRampToValueAtTime(0.5,now+i*.3+.02); g.gain.exponentialRampToValueAtTime(0.0001,now+i*.3+.22); o.connect(g).connect(audioCtx.destination); o.start(now+i*.3); o.stop(now+i*.3+.25); }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(times>2?[400,150,400,150,400]:[300,120,300]); }catch(e){}
}
async function keepAwake(on){
  try{ if(on && !wakeLock && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>{wakeLock=null;}); }
       if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; } }catch(e){}
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && rec.status==="running") keepAwake(true); });

/* ---------- rögzítés állapota ---------- */
const rec = { status:"idle", type:store.lastType, mode:store.lastMode, week:store.lastWeek,
  pts:[], dist:0, acc:0, resumeAt:0, start:0, splits:[], nextKm:1000, lastSplitT:0, watch:null, gps:"none", gpsMsg:"",
  steps:null, stepIdx:0, stepStart:0, stepAcc:0 };
function activeTime(){ return rec.acc + (rec.status==="running" ? (Date.now()-rec.resumeAt)/1000 : 0); }
function stepElapsed(){ return rec.stepAcc + (rec.status==="running" ? (Date.now()-rec.stepStart)/1000 : 0); }

function startGPS(){
  if(!("geolocation" in navigator)){ rec.gps="none"; rec.gpsMsg="Ez az eszköz vagy böngésző nem ad helyadatot. Az időzítő és a program így is működik."; return; }
  try{
    rec.watch = navigator.geolocation.watchPosition(onPos, err=>{
      rec.gps="none";
      rec.gpsMsg = err.code===1 ? "A helymeghatározás nincs engedélyezve. Chrome-ban koppints a címsor melletti ikonra → Engedélyek → Hely → Engedélyezés, és a telefonon is legyen bekapcsolva a Helymeghatározás. Az időzítő és a program így is megy." : "Nincs GPS-jel. Menj szabad ég alá, és várj pár másodpercet.";
      paintLive();
    }, {enableHighAccuracy:true, maximumAge:0, timeout:20000});
  }catch(e){ rec.gps="none"; rec.gpsMsg="A helymeghatározás itt nem érhető el."; }
}
function stopGPS(){ try{ if(rec.watch!==null) navigator.geolocation.clearWatch(rec.watch); }catch(e){} rec.watch=null; }
function onPos(p){
  const c=p.coords, pt={lat:c.latitude, lon:c.longitude, t:p.timestamp||Date.now(), a:c.accuracy};
  rec.gps = c.accuracy<=20 ? "ok" : "weak"; rec.gpsMsg="";
  if(rec.status!=="running"){ paintLive(); return; }
  if(c.accuracy>35){ paintLive(); return; }
  const last = rec.pts[rec.pts.length-1];
  if(last && !last.gap){
    const d=hav(last,pt), dt=(pt.t-last.t)/1000;
    if(dt<=0) return;
    if(d/dt > TYPES[rec.type].max) return;
    if(d < 3) { return; }
    rec.dist += d;
    while(rec.dist >= rec.nextKm){ const t=activeTime(); rec.splits.push(Math.round(t-rec.lastSplitT)); rec.lastSplitT=t; rec.nextKm += 1000; }
  }
  rec.pts.push(pt);
  paintLive();
}
function recentPace(){
  const now = Date.now(), win = rec.pts.filter(p=>!p.gap && now-p.t < 30000);
  if(win.length<2) return null;
  let d=0; for(let i=1;i<win.length;i++) d+=hav(win[i-1],win[i]);
  return {sec:(win[win.length-1].t-win[0].t)/1000, m:d};
}

function startRec(){
  ensureAudio();
  Object.assign(rec,{status:"running", pts:[], dist:0, acc:0, resumeAt:Date.now(), start:Date.now(), splits:[], nextKm:1000, lastSplitT:0, gpsMsg:""});
  store.lastType=rec.type; store.lastMode=rec.mode; store.lastWeek=rec.week; save();
  if(rec.mode==="program"){ rec.steps=programSteps(rec.week); rec.stepIdx=0; rec.stepAcc=0; rec.stepStart=Date.now(); beep(2,660); } else rec.steps=null;
  startGPS(); keepAwake(true); render();
}
function pauseRec(){ if(rec.status!=="running") return; rec.acc=activeTime(); if(rec.steps) rec.stepAcc=stepElapsed(); rec.status="paused"; const l=rec.pts[rec.pts.length-1]; if(l) rec.pts.push({gap:true}); render(); }
function resumeRec(){ if(rec.status!=="paused") return; rec.resumeAt=Date.now(); if(rec.steps) rec.stepStart=Date.now(); rec.status="running"; keepAwake(true); render(); }
function finishRec(){
  const dur = activeTime(); rec.acc = dur; rec.status="paused"; stopGPS(); keepAwake(false);
  showModal(`<h3>Kész az edzés?</h3><p class="note">${TYPES[rec.type].n}: ${km(rec.dist)} km, ${hms(dur)}</p>
    <div class="controls"><button class="btn ghost" data-act="discard">Elvetés</button><button class="btn go" data-act="save">Mentés</button></div>
    <button class="btn ghost" style="width:100%" data-act="continue">Folytatás</button>`);
}
function saveRec(){
  let pts = rec.pts; const step = Math.ceil(pts.length/1500); if(step>1) pts = pts.filter((p,i)=>p.gap || i%step===0 || i===pts.length-1);
  const a = { id: String(rec.start), type:rec.type, start:rec.start, dur:Math.round(rec.acc), dist:Math.round(rec.dist), splits:rec.splits.slice(),
    pts: pts.map(p=>p.gap?0:[+p.lat.toFixed(6), +p.lon.toFixed(6)]), prog: rec.steps ? rec.week : null };
  store.acts.unshift(a);
  if(rec.steps){ store.prog[rec.week] = (store.prog[rec.week]||0) + 1; }
  save(); resetRec(); closeModal(); location.hash = "a-"+a.id;
}
function resetRec(){ stopGPS(); keepAwake(false); Object.assign(rec,{status:"idle", pts:[], dist:0, acc:0, splits:[], steps:null}); }

/* ---------- program léptetése ---------- */
setInterval(()=>{
  if(rec.status!=="running") return;
  if(rec.steps){
    const cur = rec.steps[rec.stepIdx];
    if(cur && stepElapsed() >= cur.s){
      rec.stepIdx++; rec.stepAcc=0; rec.stepStart=Date.now();
      if(rec.stepIdx >= rec.steps.length){ beep(4,990); rec.steps.done=true; }
      else beep(rec.steps[rec.stepIdx].k==="run"?3:2, rec.steps[rec.stepIdx].k==="run"?990:660);
    }
  }
  paintLive();
}, 500);

/* ---------- útvonal rajz ---------- */
function routeSVG(pts, h=260){
  const P = pts.filter(p=>p && p!==0).map(p=>Array.isArray(p)?{lat:p[0],lon:p[1]}:p).filter(p=>p.lat!==undefined);
  const W=600, H=h, padd=24;
  let grid=""; for(let x=0;x<=W;x+=40) grid+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}"/>`; for(let y=0;y<=H;y+=40) grid+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}"/>`;
  if(P.length<2) return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Még nincs útvonal"><g stroke="var(--grid)" stroke-width="1">${grid}</g><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--muted)" font-size="16" font-family="Barlow">Az útvonal itt jelenik meg</text></svg>`;
  const lat0 = P.reduce((a,p)=>a+p.lat,0)/P.length, kx = Math.cos(lat0*Math.PI/180)*111320, ky=110540;
  const xy = P.map(p=>({x:p.lon*kx, y:-p.lat*ky}));
  const minX=Math.min(...xy.map(p=>p.x)), maxX=Math.max(...xy.map(p=>p.x)), minY=Math.min(...xy.map(p=>p.y)), maxY=Math.max(...xy.map(p=>p.y));
  const spanX=Math.max(maxX-minX,30), spanY=Math.max(maxY-minY,30), sc=Math.min((W-2*padd)/spanX,(H-2*padd)/spanY);
  const ox=(W-spanX*sc)/2, oy=(H-spanY*sc)/2;
  const tp = p=>[(ox+(p.x-minX)*sc).toFixed(1),(oy+(p.y-minY)*sc).toFixed(1)];
  // szakaszok a szünetek mentén
  let segs=[], cur=[];
  pts.forEach(p=>{ if(!p || p===0 || p.gap){ if(cur.length) segs.push(cur); cur=[]; return; } const q=Array.isArray(p)?{lat:p[0],lon:p[1]}:p; cur.push(tp({x:q.lon*kx,y:-q.lat*ky})); });
  if(cur.length) segs.push(cur);
  const lines = segs.map(s=>`<polyline points="${s.map(c=>c.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`).join("");
  const s0=tp(xy[0]), s1=tp(xy[xy.length-1]);
  // léptékvonal
  const target = spanX>2000?1000:spanX>800?500:spanX>300?200:100, lenPx = target*sc;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Útvonal"><g stroke="var(--grid)" stroke-width="1">${grid}</g>${lines}
    <circle cx="${s0[0]}" cy="${s0[1]}" r="8" fill="var(--go)" stroke="var(--surface)" stroke-width="3"/>
    <circle cx="${s1[0]}" cy="${s1[1]}" r="8" fill="var(--ink)" stroke="var(--surface)" stroke-width="3"/>
    <g transform="translate(16 ${H-16})"><line x1="0" y1="0" x2="${lenPx.toFixed(0)}" y2="0" stroke="var(--muted)" stroke-width="3"/><text x="0" y="-6" fill="var(--muted)" font-size="13" font-family="Barlow">${target>=1000?target/1000+" km":target+" m"}</text></g>
    <text x="${W-16}" y="22" text-anchor="end" fill="var(--muted)" font-size="13" font-family="Barlow">É ↑</text></svg>`;
}

/* ---------- térkép (Leaflet + OpenStreetMap) ---------- */
let liveMap=null, livePolys=null, liveDot=null, actMap=null, follow=true, zoomedIn=false, lastInteract=0;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || "#E4572E";
function segsOf(pts){ const out=[]; let cur=[]; pts.forEach(p=>{ if(!p || p===0 || p.gap){ if(cur.length) out.push(cur); cur=[]; return; } cur.push(Array.isArray(p)?[p[0],p[1]]:[p.lat,p.lon]); }); if(cur.length) out.push(cur); return out; }
function tiles(map){ L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map); }
function initLiveMap(){
  if(liveMap){ liveMap.remove(); liveMap=null; }
  const el=document.getElementById("livemap"); if(!el || !window.L) return false;
  const last=[...rec.pts].reverse().find(p=>p && !p.gap);
  liveMap=L.map(el,{zoomControl:false}).setView(last?[last.lat,last.lon]:[48.7,19.7], last?16:7); tiles(liveMap);
  livePolys=L.polyline([], {color:cssVar("--accent"), weight:5, opacity:.95}).addTo(liveMap);
  liveDot=L.circleMarker(last?[last.lat,last.lon]:[0,0],{radius:8, color:"#fff", weight:3, fillColor:cssVar("--accent"), fillOpacity:1});
  if(last) liveDot.addTo(liveMap);
  zoomedIn = !!last;
  liveMap.on("dragstart zoomstart", e=>{ if(e.type==="zoomstart" && !e.originalEvent && !liveMap._userZoom) return; follow=false; lastInteract=Date.now(); });
  return true;
}
function updateLiveMap(){
  if(!liveMap) return;
  livePolys.setLatLngs(segsOf(rec.pts));
  const last=[...rec.pts].reverse().find(p=>p && !p.gap);
  if(last){
    liveDot.setLatLng([last.lat,last.lon]); if(!liveMap.hasLayer(liveDot)) liveDot.addTo(liveMap);
    if(!zoomedIn){ liveMap.setView([last.lat,last.lon], 17, {animate:false}); zoomedIn=true; follow=true; return; }
    if(!follow && Date.now()-lastInteract > 15000) follow=true;
    if(follow) liveMap.panTo([last.lat,last.lon]);
  }
}
function initActMap(a){
  if(actMap){ actMap.remove(); actMap=null; }
  const el=document.getElementById("actmap"); if(!el || !window.L) return false;
  const segs=segsOf(a.pts); if(!segs.length || segs.flat().length<2) return false;
  actMap=L.map(el,{zoomControl:true}); tiles(actMap);
  const line=L.polyline(segs,{color:cssVar("--accent"), weight:5}).addTo(actMap);
  const all=segs.flat(); 
  L.circleMarker(all[0],{radius:8,color:"#fff",weight:3,fillColor:cssVar("--go"),fillOpacity:1}).addTo(actMap);
  L.circleMarker(all[all.length-1],{radius:8,color:"#fff",weight:3,fillColor:"#18212B",fillOpacity:1}).addTo(actMap);
  actMap.fitBounds(line.getBounds(),{padding:[24,24]});
  return true;
}
function exportData(){
  const blob=new Blob([JSON.stringify(store)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="mozgas-mentes-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!Array.isArray(d.acts)) throw 0;
      const ids=new Set(store.acts.map(x=>x.id)); d.acts.forEach(x=>{ if(!ids.has(x.id)) store.acts.push(x); });
      store.acts.sort((x,y)=>y.start-x.start); store.prog=Object.assign({}, d.prog||{}, store.prog); save(); render();
      showModal(`<h3>Visszatöltve</h3><p class="note">${d.acts.length} edzés beolvasva.</p><button class="btn go" style="width:100%" data-act="close">Rendben</button>`);
    }catch(e){ showModal(`<h3>Hibás fájl</h3><p class="note">Ez nem egy Mozgás mentésfájl.</p><button class="btn ghost" style="width:100%" data-act="close">Bezárás</button>`); } };
  r.readAsText(file);
}

/* ---------- nézetek ---------- */
const app = () => document.getElementById("app");
function showModal(html){ document.getElementById("modal").innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="box">${html}</div></div>`; }
function closeModal(){ document.getElementById("modal").innerHTML=""; }

function renderRec(){
  const t = TYPES[rec.type];
  if(rec.status==="idle"){
    const st = programSteps(rec.week);
    app().innerHTML = `<h1>Rögzítés</h1><p class="sub">Futás, séta vagy bicikli, GPS-szel.</p>
      <div class="seg" role="group" aria-label="Típus">${Object.entries(TYPES).map(([k,v])=>`<button data-type="${k}" aria-pressed="${rec.type===k}">${v.ico} ${v.n}</button>`).join("")}</div>
      ${rec.type==="futas" ? `<div class="seg" role="group" aria-label="Mód"><button data-mode="szabad" aria-pressed="${rec.mode==="szabad"}">Szabad futás</button><button data-mode="program" aria-pressed="${rec.mode==="program"}">Futás-séta program</button></div>` : ""}
      ${rec.type==="futas" && rec.mode==="program" ? `
        <div class="weeks">${WEEKS.map((w,i)=>{ const n=i+1, done=(store.prog[n]||0); return `<button class="wk ${done>=2?"done":""}" data-week="${n}" aria-pressed="${rec.week===n}"><b>${n}. hét</b><span>${done}/2 kész</span></button>`; }).join("")}</div>
        <div class="card"><b>${rec.week}. hét:</b> ${weekLabel(rec.week)}<div class="note">5 perc bemelegítő séta az elején, 3 perc levezető séta a végén. Összesen kb. ${Math.round(stepsTotal(st)/60)} perc. Hetente 2 alkalom, utána jöhet a következő hét.</div></div>` : ""}
      <div class="warn">Futás közben ne zárd le a telefont, mert lezárt képernyővel a böngésző leállítja a GPS-t. Az app közben ébren tartja a kijelzőt. Indítás előtt várd meg, hogy a GPS jele zöld legyen. Indulás előtt kérdezd meg az orvosodat, mennyit terhelheted magad.</div>
      <div class="controls"><button class="btn go" data-act="start">Start</button></div>`;
    return;
  }
  const prog = rec.steps ? `<div class="phase" id="phase"></div>` : "";
  app().innerHTML = `<h1>${t.ico} ${t.n}</h1>
    <span class="gps" id="gps"><i></i><span></span></span>
    <div id="gpsmsg"></div>
    ${prog}
    <div class="big"><div class="val" id="v-time">0:00</div><div class="lbl">Idő</div></div>
    <div class="stats">
      <div class="stat"><b id="v-dist">0,00</b><span>km</span></div>
      <div class="stat"><b id="v-cur">–:––</b><span>${rec.type==="bicikli"?"km/h most":"tempó most"}</span></div>
      <div class="stat"><b id="v-avg">–:––</b><span>${rec.type==="bicikli"?"km/h átlag":"átlagtempó"}</span></div>
    </div>
    <div class="mapwrap"><div class="map" id="livemap"></div><button class="recenter" data-act="recenter">Középre</button></div><div class="route" id="v-route" hidden></div>
    <div class="controls">${rec.status==="running" ? `<button class="btn dark" data-act="pause">Szünet</button>` : `<button class="btn go" data-act="resume">Folytatás</button>`}<button class="btn ghost" data-act="finish">Befejezés</button></div>
    <div id="v-splits"></div>`;
  follow=true;
  if(!initLiveMap()){ const r=document.getElementById("v-route"); if(r) r.hidden=false; }
  paintLive(true);
}
let lastRouteDraw = 0;
function paintLive(force){
  if(currentView()!=="rogzites" || rec.status==="idle") { paintTabs(); return; }
  const $ = id => document.getElementById(id); if(!$("v-time")) return;
  const tt = activeTime();
  $("v-time").textContent = hms(tt);
  $("v-dist").textContent = km(rec.dist);
  const rp = recentPace();
  if(rec.type==="bicikli"){ $("v-cur").textContent = rp?speed(rp.sec,rp.m):"0,0"; $("v-avg").textContent = speed(tt, rec.dist); }
  else { $("v-cur").textContent = rp?pace(rp.sec,rp.m):"–:––"; $("v-avg").textContent = pace(tt, rec.dist); }
  const g = $("gps"); g.className = "gps "+(rec.gps==="ok"?"ok":rec.gps==="weak"?"weak":""); g.lastElementChild.textContent = rec.gps==="ok"?"Jó GPS-jel":rec.gps==="weak"?"Gyenge GPS-jel":"GPS keresése…";
  $("gpsmsg").innerHTML = rec.gpsMsg ? `<div class="warn" style="margin-top:10px">${esc(rec.gpsMsg)}</div>` : "";
  if(rec.steps){
    const ph = $("phase"), st = rec.steps;
    if(rec.stepIdx >= st.length){ ph.className="phase done"; ph.innerHTML = `<div class="pname">Program kész!</div><div class="pnext">Szép munka. Nyomd meg a Befejezést a mentéshez.</div>`; }
    else { const cur = st[rec.stepIdx], left = cur.s - stepElapsed(), nx = st[rec.stepIdx+1];
      ph.className = "phase "+cur.k;
      ph.innerHTML = `<div class="pname">${cur.n}</div><div class="pcount">${hms(left)}</div><div class="pnext">${nx?`Következik: ${nx.n} (${fmtMin(nx.s)})`:"Ez az utolsó szakasz"} · ${rec.stepIdx+1}/${st.length}</div><div class="pbar"><i style="width:${(stepElapsed()/cur.s*100).toFixed(1)}%"></i></div>`; }
  }
  if(force || Date.now()-lastRouteDraw > 3000){ if(liveMap) updateLiveMap(); else $("v-route").innerHTML = routeSVG(rec.pts, 240); lastRouteDraw = Date.now(); }
  $("v-splits").innerHTML = rec.splits.length ? `<h2>Kilométerek</h2><div class="tablewrap"><table><thead><tr><th>km</th><th>Idő</th><th>${rec.type==="bicikli"?"km/h":"Tempó"}</th></tr></thead><tbody>${rec.splits.map((s,i)=>`<tr><td>${i+1}.</td><td>${hms(s)}</td><td>${rec.type==="bicikli"?speed(s,1000):pace(s,1000)}</td></tr>`).join("")}</tbody></table></div>` : "";
  paintTabs();
}

function actRow(a){
  const t=TYPES[a.type];
  return `<button class="row" data-open="${a.id}"><span class="ico" aria-hidden="true">${t.ico}</span><span class="t">${t.n}${a.prog?` · ${a.prog}. hét`:""}</span><span class="d">${km(a.dist)}<small>km</small></span><span class="m">${dateStr(a.start)} · ${hms(a.dur)} · ${a.type==="bicikli"?speed(a.dur,a.dist)+" km/h":pace(a.dur,a.dist)+" /km"}</span></button>`;
}
function renderLog(){
  app().innerHTML = `<h1>Napló</h1><p class="sub">Az összes mentett edzésed.</p>` +
    (store.acts.length ? `<div class="list">${store.acts.map(actRow).join("")}</div>` : `<div class="empty">Még nincs mentett edzés. Indíts egyet a Rögzítés fülön.</div>`) +
    `<div class="backup"><button class="btn ghost small" data-act="export">Biztonsági mentés fájlba</button><label class="btn ghost small" style="display:inline-flex;align-items:center">Visszatöltés fájlból<input type="file" accept="application/json,.json" id="importfile" hidden></label></div><p class="note">Az edzéseid csak ezen a telefonon, a böngészőben tárolódnak. Havonta egyszer érdemes fájlba menteni őket.</p>`;
}
function renderAct(id){
  const a = store.acts.find(x=>x.id===id); if(!a){ location.hash="naplo"; return; }
  const t=TYPES[a.type], bike=a.type==="bicikli";
  app().innerHTML = `<button class="back" data-nav="naplo">‹ Napló</button><h1>${t.ico} ${t.n}</h1><p class="sub">${dateStr(a.start)}${a.prog?` · futás-séta program, ${a.prog}. hét`:""}</p>
    <div class="stats"><div class="stat"><b>${km(a.dist)}</b><span>km</span></div><div class="stat"><b>${hms(a.dur)}</b><span>idő</span></div><div class="stat"><b>${bike?speed(a.dur,a.dist):pace(a.dur,a.dist)}</b><span>${bike?"km/h":"/km"}</span></div></div>
    <div class="map tall" id="actmap"></div><div class="route" id="actsvg" hidden>${routeSVG(a.pts, 300)}</div>
    ${a.splits.length?`<h2>Kilométerek</h2><div class="tablewrap"><table><thead><tr><th>km</th><th>Idő</th><th>${bike?"km/h":"Tempó"}</th></tr></thead><tbody>${a.splits.map((s,i)=>`<tr><td>${i+1}.</td><td>${hms(s)}</td><td>${bike?speed(s,1000):pace(s,1000)}</td></tr>`).join("")}</tbody></table></div>`:""}
    <div class="controls" style="margin-top:18px"><button class="btn ghost" data-del="${a.id}">Törlés</button></div>`;
  if(!initActMap(a)){ document.getElementById("actmap").hidden=true; document.getElementById("actsvg").hidden=false; }
}
function weekStart(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-day); return x.getTime(); }
function renderStats(){
  const now=Date.now(), ws=weekStart(now), ms=new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime();
  const sum = (from, type) => store.acts.filter(a=>a.start>=from && (!type||a.type===type)).reduce((o,a)=>({n:o.n+1,d:o.d+a.dist,t:o.t+a.dur}),{n:0,d:0,t:0});
  const block = (title, from) => `<h2>${title}</h2><div class="tablewrap"><table><thead><tr><th>Típus</th><th>Alkalom</th><th>Táv</th><th>Idő</th></tr></thead><tbody>${Object.entries(TYPES).map(([k,v])=>{ const s=sum(from,k); return `<tr><td>${v.ico} ${v.n}</td><td>${s.n}</td><td>${km(s.d)} km</td><td>${hms(s.t)}</td></tr>`; }).join("")}</tbody></table></div>`;
  // 8 hetes futás grafikon
  const weeks=[]; for(let i=7;i>=0;i--){ const st=ws-i*7*86400000, en=st+7*86400000; weeks.push({st, d:store.acts.filter(a=>a.type==="futas"&&a.start>=st&&a.start<en).reduce((x,a)=>x+a.dist,0)}); }
  const maxD=Math.max(1000,...weeks.map(w=>w.d));
  const bars = weeks.map((w,i)=>{ const h=Math.round(w.d/maxD*120); const x=20+i*70; const lab=new Date(w.st).toLocaleDateString("hu-HU",{month:"numeric",day:"numeric"}); return `<rect x="${x}" y="${150-h}" width="44" height="${h}" rx="6" fill="${i===7?"var(--accent)":"var(--walk)"}"/><text x="${x+22}" y="${145-h}" text-anchor="middle" font-size="13" fill="var(--ink)" font-family="Barlow">${w.d?km(w.d):""}</text><text x="${x+22}" y="170" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Barlow">${lab}</text>`; }).join("");
  // rekordok
  const runs = store.acts.filter(a=>a.type==="futas");
  const longest = runs.reduce((b,a)=>!b||a.dist>b.dist?a:b,null);
  let bestKm=null; runs.forEach(a=>a.splits.forEach(s=>{ if(bestKm===null||s<bestKm) bestKm=s; }));
  const best3 = runs.filter(a=>a.dist>=3000).reduce((b,a)=>{ const p=a.dur/a.dist; return !b||p<b.p?{p,a}:b; },null);
  app().innerHTML = `<h1>Statisztika</h1><p class="sub">Heti és havi összesítés, rekordok.</p>
    <h2>Futás az utolsó 8 hétben</h2><div class="route"><svg viewBox="0 0 580 180" role="img" aria-label="Heti futótáv az utolsó 8 hétben">${bars}</svg></div>
    ${block("Ezen a héten", ws)}${block("Ebben a hónapban", ms)}
    <h2>Futórekordok</h2><div class="card">
      <div>Leghosszabb futás: <b>${longest?km(longest.dist)+" km":"–"}</b></div>
      <div>Leggyorsabb kilométer: <b>${bestKm!==null?pace(bestKm,1000)+" /km":"–"}</b></div>
      <div>Legjobb átlagtempó (3 km felett): <b>${best3?pace(best3.a.dur,best3.a.dist)+" /km":"–"}</b></div>
      <div>Futás-séta program: <b>${Object.values(store.prog).reduce((a,b)=>a+b,0)} alkalom kész</b></div>
    </div>`;
}

/* ---------- navigáció ---------- */
function currentView(){ const h=location.hash.slice(1); return h.startsWith("a-")?"act":(["rogzites","naplo","statisztika"].includes(h)?h:"rogzites"); }
function paintTabs(){
  const v=currentView(), sel = v==="act"?"naplo":v;
  document.querySelectorAll(".tab").forEach(b=>{ b.setAttribute("aria-selected", b.dataset.tab===sel?"true":"false"); if(b.dataset.tab==="rogzites") b.classList.toggle("live", rec.status!=="idle"); });
}
function render(){
  const v=currentView();
  if(liveMap){ liveMap.remove(); liveMap=null; } if(actMap){ actMap.remove(); actMap=null; }
  if(v==="rogzites") renderRec(); else if(v==="naplo") renderLog(); else if(v==="statisztika") renderStats(); else renderAct(location.hash.slice(3));
  paintTabs();
}
window.addEventListener("hashchange", ()=>{ render(); window.scrollTo(0,0); });
document.addEventListener("click", e=>{
  const T = e.target;
  const tab=T.closest(".tab"); if(tab){ if(location.hash==="#"+tab.dataset.tab) render(); else location.hash=tab.dataset.tab; return; }
  const ty=T.closest("[data-type]"); if(ty){ rec.type=ty.dataset.type; render(); return; }
  const md=T.closest("[data-mode]"); if(md){ rec.mode=md.dataset.mode; render(); return; }
  const wk=T.closest("[data-week]"); if(wk){ rec.week=+wk.dataset.week; render(); return; }
  const op=T.closest("[data-open]"); if(op){ location.hash="a-"+op.dataset.open; return; }
  const nv=T.closest("[data-nav]"); if(nv){ location.hash=nv.dataset.nav; return; }
  const dl=T.closest("[data-del]"); if(dl){ showModal(`<h3>Törlöd?</h3><p class="note">Ez az edzés véglegesen törlődik.</p><div class="controls"><button class="btn ghost" data-act="close">Mégse</button><button class="btn go" data-act="del" data-id="${dl.dataset.del}">Törlés</button></div>`); return; }
  const ac=T.closest("[data-act]"); if(!ac) return;
  const a=ac.dataset.act;
  if(a==="start") startRec();
  else if(a==="pause") pauseRec();
  else if(a==="resume") resumeRec();
  else if(a==="finish") finishRec();
  else if(a==="save") saveRec();
  else if(a==="discard"){ resetRec(); closeModal(); render(); }
  else if(a==="continue"){ closeModal(); startGPS(); resumeRec(); }
  else if(a==="close") closeModal();
  else if(a==="export") exportData();
  else if(a==="recenter"){ follow=true; const l=[...rec.pts].reverse().find(p=>p && !p.gap); if(liveMap && l) liveMap.setView([l.lat,l.lon],17); }
  else if(a==="del"){ const id=ac.dataset.id; const x=store.acts.find(q=>q.id===id); if(x&&x.prog&&store.prog[x.prog]) store.prog[x.prog]--; store.acts=store.acts.filter(q=>q.id!==id); save(); closeModal(); location.hash="naplo"; }
});
document.addEventListener("change", e=>{ if(e.target.id==="importfile" && e.target.files[0]) importData(e.target.files[0]); });
window.addEventListener("beforeunload", e=>{ if(rec.status!=="idle"){ e.preventDefault(); e.returnValue=""; } });
render();
</script>
</body>
